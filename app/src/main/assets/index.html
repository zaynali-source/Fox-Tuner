<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Fox Tuner</title>
<style>
:root{--bg:#000;--s:#151515;--s2:#242424;--line:#2a2a2a;--t:#fff;--m:#8c8c8c;--a:#fff;--at:#000;--r:#d71921;--w:#ff8a80;--mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.35 "Roboto Flex",Roboto,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{padding:0 16px calc(48px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:active{opacity:.7}
.top{display:flex;align-items:center;gap:12px;padding:calc(30px + env(safe-area-inset-top)) 4px 18px}
.top h1{font-size:34px;font-weight:300;letter-spacing:-.01em;margin:0;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#333}.dot.on{background:var(--r)}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--s2);flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#7a7a7a;transition:transform .15s,background .15s}
.sw.on{background:var(--a)}.sw.on::after{transform:translateX(20px);background:var(--at)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:62px;border-radius:31px;background:var(--s);font-size:15px;color:var(--t)}
.seg button.on{background:var(--a);color:var(--at);font-weight:600}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--s);border-radius:22px;padding:4px;margin-top:12px}
.tabs button{height:38px;border-radius:18px;color:var(--m);font-size:14px}
.tabs button.on{background:var(--a);color:var(--at);font-weight:600}
.sec{content-visibility:auto;contain-intrinsic-size:auto 120px;margin-top:12px;background:var(--s);border-radius:28px;padding:16px 18px 18px;contain:layout paint}
.sec.off .body{opacity:.28;pointer-events:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:26px}
.ft{display:flex;align-items:center;gap:8px;flex:1;text-align:left;height:26px}
.chev{width:7px;height:7px;border-right:1.5px solid var(--m);border-bottom:1.5px solid var(--m);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sec.open .chev{transform:rotate(225deg) translateY(-2px)}
.sec.fold:not(.open) .body{display:none}
.sec.fold:not(.open) .hd{margin-bottom:0}
.hd span{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.chips{display:flex;gap:6px}
.chip{flex:1 1 0;min-width:0;height:40px;border-radius:20px;background:var(--s2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.chip.on{background:var(--a);color:var(--at);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border-radius:30px;background:var(--s);padding:20px 18px 18px;min-height:150px;display:flex;flex-direction:column;gap:6px;color:var(--t)}
.tile b{font-size:19px;font-weight:600;margin-top:auto}.tile small{font-size:13px;color:var(--m);line-height:1.3}
.tile.on{background:var(--a);color:var(--at)}.tile.on small{color:#555}
.tile .tn{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(127,127,127,.18)}
.tile .tn i{display:block;width:16px;height:2px;background:currentColor;border-radius:1px;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor}
.tile em{font-style:normal;font:11px var(--mono);letter-spacing:.12em;margin-top:2px}
.chip:disabled{opacity:.28;pointer-events:none}
.cfl{font-size:12px;color:var(--m);margin:6px 2px 0;line-height:1.4}
.row.dis{opacity:.45}.row.dis .sw{pointer-events:none}
.chip.rs{height:50px;line-height:1.2;white-space:normal;font-weight:500}.chip.rs span{font-size:11px;opacity:.7;font-weight:400}
.chip.more{flex:.5;color:var(--m);font-size:18px;line-height:1}
.sub{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin:16px 0 8px}
.cpus{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cpu:disabled{opacity:.28;pointer-events:none}
.cpu{aspect-ratio:1;border-radius:50%;background:var(--s2);font-size:13px;color:var(--m)}
.cpu.on{background:var(--a);color:var(--at);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;background-image:radial-gradient(circle,#3a3a3a 1px,transparent 1.2px);background-size:6px 2px;background-repeat:repeat-x;background-position:top}
.row:first-of-type,.hd+.row{background-image:none}
.row .g{flex:1;min-width:0}.row b{display:block;font-weight:400}.row small{color:var(--m);font-size:12px}
.row.off{opacity:.3;pointer-events:none}
.lnk{color:var(--t);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.warn{color:var(--w);font-size:12px;margin-top:8px}
details{margin-top:12px;background:var(--s);border-radius:28px;padding:0 18px}
summary{padding:18px 0;color:var(--m);font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{padding-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 6px}
.tag{font:10px var(--mono);padding:4px 9px;border-radius:12px;background:var(--s2);color:var(--m)}.tag.ok{color:var(--t)}.tag.bad{color:var(--w)}
.bk{display:flex;gap:8px;margin-top:2px}
.bk .btn{flex:1;height:44px;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.show{display:flex}
.sheet{background:#111;width:100%;max-width:560px;max-height:86vh;border-radius:32px 32px 0 0;padding:22px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sheet h4{margin:0 0 4px;font-size:20px;font-weight:400}.sheet p{margin:0 0 10px;font-size:12px;color:var(--m)}
.list{overflow:auto;flex:1}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #555;flex:none;position:relative}
.opt.on .rd{border-color:var(--a)}.opt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--a)}
.opt .t{flex:1;min-width:0}.opt small{display:block;color:var(--m);font-size:11px}
.opt select{background:var(--s2);color:var(--t);border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:13px}
.act{display:flex;gap:8px;justify-content:flex-end;padding-top:14px}
.btn{border-radius:22px;padding:11px 22px;font-size:14px;background:var(--s2)}.btn.p{background:var(--a);color:var(--at);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:22px;font-size:13px;display:none;z-index:30;white-space:nowrap}
.toast.show{display:block}
.in{height:44px;border-radius:22px;background:var(--s2);border:0;color:var(--t);text-align:center;width:100%;font:inherit;outline:0}
.in:focus{box-shadow:inset 0 0 0 1px #fff}
.two{display:flex;gap:8px;align-items:center}.two i{color:var(--m);font-style:normal}
.big{font:300 30px var(--mono);letter-spacing:-.02em}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.f{animation:fin .2s ease-out}
.sec.open .body{animation:fin .2s ease-out}
.chip,.seg button,.cpu,.btn,.tabs button{transition:transform .08s,background .12s,color .12s}
.chip:active,.seg button:active,.cpu:active,.btn:active,.tabs button:active{transform:scale(.95);opacity:1}
body{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 32px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:32px;background:rgba(22,22,22,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #2a2a2a;z-index:5}
#nav button{height:46px;border-radius:24px;color:var(--m);font-size:13px;transition:background .15s,color .15s}
#nav button.on{background:var(--a);color:var(--at);font-weight:600}
.ban{background:#2a1513;color:var(--w);padding:14px;border-radius:22px;margin:8px 0;font-size:13px}
.bk{display:flex;align-items:center;gap:12px;margin:2px 0 14px;position:sticky;top:0;z-index:5;padding:8px 0;background:var(--bg,#0b0b0d)}.bk button{width:40px;height:40px;border-radius:14px;border:0;font-size:28px;line-height:1;background:rgba(255,255,255,.08);color:inherit}.bk b{display:block;font-size:17px}.bk small{opacity:.6}.tile{transition:transform .12s,box-shadow .2s}.tile:active{transform:scale(.97)}.sec{border-radius:18px}
</style>
</head>
<body>
<div class="top"><h1>Fox Tuner</h1><i class="dot" id="dot"></i><button class="sw" id="master" aria-label="Apply profiles"></button></div>
<div id="ban"></div>
<main id="app" class="f"></main>
<nav id="nav"><button class="on" data-view="prof">Profiles</button><button data-view="game">Game</button><button data-view="more">More</button></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- bridge (KernelSU / APatch WebUI) ---------- */
const CTL = 'sh /data/adb/modules/profiles_tuner/bin/ptctl.sh';
const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
function exec(cmd){
  return new Promise(res => {
    if(!window.ksu || typeof ksu.exec !== 'function'){ res({code:-1,out:''}); return; }
    const cb = '_c' + Date.now() + Math.random().toString(36).slice(2);
    window[cb] = (code,out) => { res({code,out:out||''}); delete window[cb]; };
    try{ ksu.exec(cmd,'{}',cb); }catch(e){ res({code:-2,out:''}); }
  });
}
const ctl = (...a) => exec(`${CTL} ${a.map(q).join(' ')}`);

/* one serialized command queue; writes are batched into a single shell call */
let chain = Promise.resolve(), pend = new Map(), timer = null, extra = [];
const run = fn => (chain = chain.then(fn).catch(()=>{}));
function setKey(k,v){ S[k] = v; pend.set(k,v); clearTimeout(timer); timer = setTimeout(flush,120); }
function flush(){
  clearTimeout(timer); timer = null;
  if(!pend.size) return;
  const items = [...pend]; pend = new Map();
  const cmd = items.map(([k,v]) => `${CTL} setq ${q(k)} ${q(v)}`).join('; ') + `; ${CTL} apply`;
  run(() => exec(cmd));
}

/* ---------- tables ---------- */
const MODES = [['battery','Battery'],['normal','Normal'],['performance','Performance'],['extreme','Extreme']];
const CL = [['little','Little'],['big','Big'],['prime','Prime']];
const PR = [[0,'Minimal'],[1,'Low'],[2,'Medium'],[3,'Maximum']];
const THR = {battery:[3,6,10,15],normal:[3,6,10,15],performance:[0,3,6,10],extreme:[0,3,6,10]};
const WIN = {
  little:{battery:[1708800,1593600,1478400,1344000],normal:[2016000,1900800,1843200,1708800],performance:[2016000,1900800,1843200,1708800],extreme:[2016000,1900800,1843200,1708800]},
  big:{battery:[2073600,1920000,1824000,1708800],normal:[2361600,2188800,2073600,1920000],performance:[2572800,2361600,2188800,2073600],extreme:[2803200,2707200,2611200,2572800]},
  prime:{battery:[1900800,1766400,1651200,1459200],normal:[2304000,2150400,1900800,1766400],performance:[2803200,2668800,2457600,2304000],extreme:[3014400,2918400,2803200,2668800]}};
const GW = {max:{battery:[684,633,500,353],normal:[900,835,736,684],performance:[950,900,835,736],extreme:[1100,1000,950,900]},min:[633,500,353,255]};
const SHIFT = {extreme:0,performance:3,normal:5,battery:8};
const TH = [['normal','Normal'],['huanji','Huanji'],['nolimits','No Limits'],['class0','Class 0'],['arvr','AR/VR'],['navigation','Navigation'],['video','Video'],['videochat','Video Chat'],['camera','Camera'],['4k','4K Video'],['mgame','Mobile Game'],['highfps','High FPS'],['tgame18','TGame']];
const TIDX = {normal:0,huanji:1,nolimits:6,class0:7,arvr:9,navigation:10,video:11,videochat:14,camera:15,'4k':16,mgame:19,highfps:26,tgame18:18};
const THN = Object.fromEntries(TH);
const DEF = {"active":"normal","opt.enabled":"1","opt.takeover":"1","opt.default":"normal","opt.autobackup":"1","opt.bundle":"1","opt.watch":"0","sec.threshold":"1","sec.priority":"1","sec.freq":"1","sec.gpu":"1","sec.thermal":"1","sec.touch":"0","sec.gov":"1","sec.cpuset":"0","thermal.normal":"0","thermal.huanji":"1","thermal.nolimits":"6","thermal.class0":"7","thermal.arvr":"9","thermal.navigation":"10","thermal.video":"11","thermal.videochat":"14","thermal.camera":"15","thermal.4k":"16","thermal.mgame":"19","thermal.highfps":"26","cs.background":"0","cs.camera-daemon":"0,1,2,3,4,5,7","cs.foreground":"0,1,2,3,4,5","cs.foreground_window":"0,1,2,3,4,6,7","cs.restricted":"0,1,2,3,5,6,7","cs.surfaceflinger":"0,1,2,3,4,5,7","cs.system-background":"0,1","cs.top-app":"0,1,2,3,4,5,6,7","battery.threshold":"6","battery.touch":"0","battery.thermal":"normal","battery.little.prio":"3","battery.little.max":"1478400","battery.little.hsfreq":"1113600","battery.little.hsload":"90","battery.little.tls":"4","battery.little.boost":"0","battery.big.prio":"1","battery.big.max":"1824000","battery.big.hsfreq":"1190400","battery.big.hsload":"85","battery.big.tls":"4","battery.big.boost":"3","battery.prime.prio":"0","battery.prime.max":"1651200","battery.prime.hsfreq":"1459200","battery.prime.hsload":"85","battery.prime.tls":"4","battery.prime.boost":"3","battery.gpu.max":"500000000","battery.gpu.min":"255000000","normal.threshold":"6","normal.touch":"0","normal.thermal":"normal","normal.little.prio":"3","normal.little.max":"2016000","normal.little.hsfreq":"1113600","normal.little.hsload":"90","normal.little.tls":"4","normal.little.boost":"3","normal.big.prio":"2","normal.big.max":"2188800","normal.big.hsfreq":"1190400","normal.big.hsload":"85","normal.big.tls":"4","normal.big.boost":"3","normal.big.minc":"3","normal.prime.prio":"2","normal.prime.max":"2150400","normal.prime.hsfreq":"1459200","normal.prime.hsload":"85","normal.prime.tls":"4","normal.prime.boost":"3","normal.prime.minc":"0","normal.gpu.max":"835000000","normal.gpu.min":"255000000","performance.threshold":"3","performance.touch":"0","performance.thermal":"nolimits","performance.little.prio":"2","performance.little.max":"2016000","performance.little.hsfreq":"1113600","performance.little.hsload":"90","performance.little.tls":"4","performance.little.boost":"12","performance.big.prio":"3","performance.big.max":"2361600","performance.big.hsfreq":"1190400","performance.big.hsload":"85","performance.big.tls":"4","performance.big.boost":"18","performance.prime.prio":"3","performance.prime.max":"2668800","performance.prime.hsfreq":"1459200","performance.prime.hsload":"85","performance.prime.tls":"4","performance.prime.boost":"15","performance.gpu.max":"900000000","performance.gpu.min":"353000000","extreme.threshold":"0","extreme.touch":"0","extreme.thermal":"nolimits","extreme.little.prio":"3","extreme.little.max":"2016000","extreme.little.hsfreq":"1113600","extreme.little.hsload":"90","extreme.little.tls":"4","extreme.little.boost":"10","extreme.big.prio":"3","extreme.big.max":"2803200","extreme.big.hsfreq":"1190400","extreme.big.hsload":"85","extreme.big.tls":"4","extreme.big.boost":"15","extreme.prime.prio":"3","extreme.prime.max":"3014400","extreme.prime.hsfreq":"1459200","extreme.prime.hsload":"85","extreme.prime.tls":"4","extreme.prime.boost":"20","extreme.gpu.max":"1100000000","extreme.gpu.min":"500000000"};
const FULL = {little:[364800,441600,595200,787200,902400,1017600,1113600,1228800,1344000,1478400,1593600,1708800,1843200,1900800,2016000],big:[480000,633600,787200,940800,1056000,1190400,1286400,1401600,1497600,1593600,1708800,1824000,1920000,2073600,2188800,2361600,2572800,2611200,2707200,2803200],prime:[480000,633600,787200,960000,1094400,1209600,1324800,1459200,1651200,1766400,1900800,2150400,2304000,2457600,2668800,2803200,2918400,3014400],gpu:[255,353,500,633,684,736,835,900,950,1000,1100]};
const CSDEF = ['background','camera-daemon','foreground','foreground_window','restricted','surfaceflinger','system-background','top-app'];

/* ---------- state ---------- */
const haptic = () => { try{ if(window.ksu && typeof ksu.haptic==='function') ksu.haptic(); }catch(e){} };
let view = 'prof', D = {pw:0,ph:0,w:0,h:0,pd:0,d:0,ow:'',od:''};
let S = {...DEF}, cluster = 'little', ready = false;
try{ const c = localStorage.getItem('pt_state'); if(c) S = {...DEF, ...JSON.parse(c)}; }catch(e){}
const $ = id => document.getElementById(id);
function parse(t){ const o = {}; t.split('\n').forEach(l => { const i = l.indexOf('='); if(i > 0) o[l.slice(0,i)] = l.slice(i+1).trim(); }); return o; }
async function load(){ const r = await ctl('get'); if(!r.out) return false; S = {...DEF, ...parse(r.out)}; ready = true; try{ localStorage.setItem('pt_state', JSON.stringify(S)); }catch(e){} return true; }
const roles = () => (S['hw.roles']||'little big prime').trim().split(/\s+/).filter(r => CL.some(c => c[0]===r));
const nums = s => (S[s]||'').trim().split(/\s+/).filter(Boolean).map(Number).sort((a,b)=>a-b);
const gpuL = () => nums('hw.gpu.freqs').map(n => Math.round(n/1e6));
const freqs = r => { const l = r==='gpu' ? gpuL() : nums(`hw.${r}.freqs`); return l.length ? l : FULL[r]; };
function fb(list,mode){ if(!list.length) return []; const top = Math.max(0,list.length-1-(SHIFT[mode]||0)); return [...new Set([0,1,2,3].map(i => list[Math.max(0,top-i)]))]; }
function winCpu(r,m){ const b = (WIN[r]||{})[m], l = freqs(r); return b && b.every(f => l.includes(f)) ? b : fb(l,m); }
function winGpu(k,m){ const b = k==='max' ? GW.max[m] : GW.min, l = freqs('gpu'); return b && b.every(f => l.includes(f)) ? b : (k==='max' ? fb(l,m) : l.slice(0,4).reverse()); }
const ghz = k => (k/1e6).toFixed(2)+' GHz';
function ranges(s){ const o = []; (s||'').split(',').filter(Boolean).forEach(p => { const [a,b] = p.split('-').map(Number); for(let i=a;i<=(isNaN(b)?a:b);i++) o.push(i); }); return o; }
function csGroups(){ const g = (S['hw.cs.groups']||'').trim().split(/\s+/).filter(Boolean); return g.length ? g : CSDEF; }
function csSel(g){ const v = S[`cs.${g}`] ?? S[`cs.cur.${g}`]; return v ? (v.includes('-') ? ranges(v) : v.split(',').filter(Boolean).map(Number)) : []; }
function parkedCpus(){ // cpus the Cluster priority table forces offline (Minimal = max_cpus 0 on a 1-core cluster, 1 on bigger ones)
  const out = new Set(); if(S['sec.priority']==='0') return out;
  let first = 0; roles().forEach(r => { const n = +S[`hw.${r}.cpus`]||0, pr = S[`${S.active}.${r}.prio`];
    if(S[`hw.${r}.corectl`]==='1' && pr==='0'){ const keep = n>1 ? 1 : 0; for(let i=first+keep;i<first+n;i++) out.add(i); }
    first += n; });
  return out; }
function ncpu(){ const p = (S['hw.present']||'0-7').split('-'); return (parseInt(p[1],10)||7)+1; }

/* ---------- render ---------- */
const chips = (items,sel,attr) => `<div class="chips">${items.map(([v,l]) => `<button class="chip${String(v)===String(sel)?' on':''}" ${attr(v)}>${l}</button>`).join('')}</div>`;
function fmtV(kind,v){ if(v===''||v===undefined||v===null) return 'Auto'; return (kind==='cpu'||kind==='hsf') ? ghz(+v) : (kind==='gmax'||kind==='gmin') ? Math.round(v/1e6) : v; }
function chipsAll(items,key,kind){
  const sel = String(S[key] ?? ''); let it = items.slice();
  if(!it.some(x => String(x[0])===sel)) it = [...it.slice(0,it.length-1),[sel,fmtV(kind,sel)]];
  let capv = 0, nd = 0;
  if(kind==='hsf' && key.endsWith('.hsfreq') && S['sec.freq']!=='0') capv = +S[key.replace(/\.hsfreq$/,'.max')] || 0;
  const tlsLock = kind==='tls' && S['sec.threshold']!=='0';
  const dis = v => (tlsLock || (capv && v!=='' && +v > capv)) ? (nd++, ' disabled') : '';
  const hint = () => tlsLock ? `<div class="cfl">Load shift is controlled by Frequency threshold (Ulq formula: base + threshold/5). Turn off Frequency threshold to set it here.</div>` : nd ? `<div class="cfl">Frequencies above the Max frequency cap are greyed out. Raise the cap or turn off Max frequency to use them.</div>` : '';
  const out = `<div class="chips">${it.map(([v,l]) => `<button class="chip${String(v)===sel?' on':''}"${dis(v)} data-k="${key}" data-v="${v}">${l}</button>`).join('')}<button class="chip more" data-all="${key}" data-kind="${kind}" aria-label="All values">⋯</button></div>`;
  return out + hint();

    <div class="sub" style="margin-top:0">Performance mode</div>${chips(GM,gv(p,'mode','follow'),v=>`data-k="${k('mode')}" data-v="${v}"`).replace('class="chips"','class="chips" style="flex-wrap:wrap"')}
    <div class="row"><span class="g"><b>Super report rate</b><small>500 Hz touch reporting</small></span><button class="sw${gv(p,'super','1')==='1'?' on':''}" data-gsw="${k('super')}" data-def="1"></button></div>
    <div class="row"><span class="g"><b>Expert preset</b><small>Pre-tuned touch filter instead of manual values</small></span><button class="sw${ex?' on':''}" data-gsw="${k('expert')}" data-def="0" data-regame="1"></button></div>
    ${ex ? `<div class="sub">Preset</div>${ch('xpre',[[1,'1'],[2,'2'],[3,'3']],'1')}` : TUNE.map(([t,l,vals]) => `<div class="sub">${l}</div>${ch(t,vals.map(v=>[v,v]),TDEFV[t])}`).join('')}
    </div><div class="act"><button class="btn" id="gRemove">Remove</button><button class="btn p" id="close">Done</button></div>`);
}
async function addSheet(){
  await loadApps();
  const have = new Set(gamePkgs());
  const L = (APPS||[]).filter(a => !have.has(a.p)).sort((a,b) => (b.g-a.g) || a.l.localeCompare(b.l));
  sheet(`<h4>Add game</h4><p>Pick an app. Known games are listed first.</p><div class="list">${L.length ? L.map(a => `<div class="opt" data-gadd="${a.p}"><span class="t">${a.l}<small>${a.p}${a.g?' · game':''}</small></span></div>`).join('') : '<div class="sub">No apps found.</div>'}</div><div class="act"><button class="btn p" id="close">Close</button></div>`);
}
/* touch test: counts real pointer events per second (coalesced) */
function touchSheet(){
  sheet(`<h4>Touch test</h4><p>Drag your finger on the pad. Shows the real touch samples per second from the panel, not the screen refresh.</p>
    <div id="tpad" style="height:200px;border-radius:24px;background:var(--s2);position:relative;overflow:hidden"><div style="position:absolute;left:16px;top:12px"><div class="big" id="thz">0</div><div class="sub" style="margin:0">Hz · <span id="tmx">0</span> max</div></div></div>
    <div class="row" style="margin-top:8px"><span class="g"><b>Game mode</b><small>touch_dev/game_mode</small></span><button class="sw" data-tt="game"></button></div>
    <div class="row"><span class="g"><b>Super report rate</b><small>bump_sample_rate · 500 Hz</small></span><button class="sw" data-tt="super"></button></div>
    <div class="act"><button class="btn p" id="close">Done</button></div>`);
  let mx = 0;
  const iv = setInterval(() => {
    if(!$('tpad')){ clearInterval(iv); return; }
    let n = 0; try{ n = ksu.touchHz(); }catch(e){}
    if(n>mx) mx = n; $('thz').textContent = n; $('tmx').textContent = mx;
  }, 350);
}

/* ---------- events (delegated) ---------- */
function setView(v){
  view = v; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.view===(v==='kern'?'prof':v)));
  const a = $('app'); a.classList.remove('f'); void a.offsetWidth; a.classList.add('f');
  window.scrollTo(0,0); render(); if(v==='disp') loadDisp().then(render); if(v==='game') loadApps().then(render);
}
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if(b && b.dataset.view && b.dataset.view!==view){ haptic(); setView(b.dataset.view); } });
$('master').addEventListener('click', () => { const nv = (S['opt.enabled']??'1')==='1' ? '0' : '1'; S['opt.enabled'] = nv; render(); run(()=>ctl('opt','enabled',nv)); toast(nv==='1'?'Profiles on':'Profiles paused'); });
$('app').addEventListener('click', e => {
  const tn = e.target.closest('[data-tune]');
  if(tn){ haptic(); const id = tn.dataset.tune; if(id!==S.active){ flush(); S.active = id; run(()=>ctl('mode',id)); } setView('kern'); return; }
  const t = e.target.closest('button'); if(!t) return;
  haptic();
  if(t.dataset.tm){
    const k = t.dataset.tm, has = TM.includes(k);
    if(has && TM.length===1){ toast('Keep at least one mode'); return; }
    TM = TM_ALL.map(x => x[0]).filter(x => x===k ? !has : TM.includes(x));
    try{ ksu.setTileModes(TM.join(',')); }catch(e){}
    t.classList.toggle('on'); return;
  }
  if(t.id==='back'){ haptic(); setView('prof'); return; }
  if(t.dataset.view){ view = t.dataset.view; if(view==='disp'){ render(); loadDisp().then(render); } else render(); return; }
  if(view==='disp'){
    const num = id => { const v = parseInt(document.getElementById(id)?.value,10); return v; };
    if(t.dataset.res){ dispChange('wm size '+t.dataset.res, revCmd()); return; }
    if(t.dataset.dpi){ dispChange('wm density '+t.dataset.dpi, revCmd()); return; }
    if(t.dataset.dreset){ dispChange('wm '+t.dataset.dreset+' reset', revCmd()); return; }
    if(t.id==='resApply'){ const w = num('cw'), h = num('ch'); if(!(w>=320&&w<=D.pw*1.5&&h>=480&&h<=D.ph*1.5)){ toast('Invalid size'); return; } dispChange(`wm size ${w}x${h}`, revCmd()); return; }
    if(t.id==='dpiApply'){ const d = num('cd'); if(!(d>=120&&d<=800)){ toast('DPI must be 120–800'); return; } dispChange('wm density '+d, revCmd()); return; }
    return;
  }
  if(view==='game'){
    if(t.dataset.gmaster){ const nv = S['game.master']==='1' ? '0' : '1'; S['game.master'] = nv; render(); run(()=>ctl('set','game.master',nv).then(()=>ctl('game-a11y',nv))); toast(nv==='1'?'Game Space on':'Game Space off'); return; }
    if(t.dataset.gen){ const p = t.dataset.gen, nv = gv(p,'en','0')==='1' ? '0' : '1'; S[`game.${p}.en`] = nv; render(); run(()=>ctl('set',`game.${p}.en`,nv)); return; }
    if(t.dataset.gopen){ gameSheet(t.dataset.gopen); return; }
    if(t.id==='gAdd'){ addSheet(); return; }
    return;
  }
  if(!ready){ toast('Loading…'); return; }
  if(t.id==='tTest'){ touchSheet(); return; }
  if(t.dataset.fold){ const k = t.dataset.fold; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render(); return; }
  if(t.dataset.mode){ flush(); S.active = t.dataset.mode; render(); run(()=>ctl('mode',t.dataset.mode)); return; }
  if(t.dataset.cluster){ cluster = t.dataset.cluster; render(); return; }
  if(t.dataset.all){ allSheet(t.dataset.all,t.dataset.kind); return; }
  if(t.dataset.k){ setKey(t.dataset.k,t.dataset.v); patch(t.dataset.k); if(REFLOW.test(t.dataset.k)) render(); return; }
  if(t.dataset.sec){ const k = t.dataset.sec, cur = k==='touch' ? S['sec.touch']==='1' : S[`sec.${k}`]!=='0'; setKey(`sec.${k}`, cur?'0':'1'); t.classList.toggle('on',!cur); const sc = t.closest('.sec'); if(sc) sc.classList.toggle('off',cur); if(k==='priority'||k==='freq'||k==='threshold') render(); return; }
  if(t.dataset.cs){
    const g = t.dataset.cs, i = +t.dataset.cpu; let sel = csSel(g);
    sel = sel.includes(i) ? sel.filter(x=>x!==i) : [...sel,i].sort((a,b)=>a-b);
    if(!sel.length){ toast('Keep at least one CPU'); return; }
    setKey(`cs.${g}`, sel.join(',')); t.classList.toggle('on'); return;
  }
  if(t.dataset.tg){ const nv = S['sec.touch']==='1' ? '0' : '1'; setKey('sec.touch',nv); render(); return; }
  if(t.dataset.pt){ if(S['sec.touch']==='1'){ toast('Already on for all profiles'); return; } const k = `${S.active}.touch`; setKey(k, S[k]==='1' ? '0' : '1'); render(); return; }
  if(t.id==='bkNow'){ flush(); run(async()=>{ const r = await ctl('backup'); await binfo(); render(); toast(/ok/.test(r.out)?'Backup saved':'Backup failed'); }); return; }
  if(t.id==='bkRes'){ if(!bk.ok){ toast('No backup found'); return; } sheet(`<h4>Restore backup?</h4><p>${bk.t}<br>Replaces all current profile settings.</p><div class="act"><button class="btn" id="close">Cancel</button><button class="btn p" id="doRes">Restore</button></div>`); return; }
  if(t.dataset.opt){ const k = t.dataset.opt, nv = (S[`opt.${k}`]??DEF[`opt.${k}`]??'1')==='1' ? '0' : '1'; S[`opt.${k}`] = nv; render(); run(()=>ctl('opt',k,nv)); if(k==='bundle') toast('Reboot to apply'); return; }
  if(t.id==='thBtn'){ thermalSheet(); return; }
  if(t.id==='csReset'){ run(async()=>{ await ctl('resetcs'); await load(); render(); }); toast('Cpuset reset'); return; }
  if(t.id==='rm') sheet(`<h4>Reset ${MODES.find(x=>x[0]===S.active)[1]}?</h4><p>Restore default values for this mode.</p><div class="act"><button class="btn" id="close">Cancel</button><button class="btn p" id="doRm">Reset</button></div>`);
  if(t.id==='ra') sheet(`<h4>Reset all profiles?</h4><p>Restore default values for all modes.</p><div class="act"><button class="btn" id="close">Cancel</button><button class="btn p" id="doRa">Reset all</button></div>`);
});
$('sheet').addEventListener('click', e => {
  if(e.target.closest('select')) return;
  const ga = e.target.closest('[data-gadd]');
  if(ga){ const p = ga.dataset.gadd; S[`game.${p}.en`] = '1'; run(()=>ctl('set',`game.${p}.en`,'1')); gameSheet(p); render(); return; }
  const pk = e.target.closest('[data-pick]');
  if(pk){ setKey(pk.dataset.pick, pk.dataset.v); closeSheet(); render(); return; }
  const b = e.target.closest('button');
  if(b){
    if(b.id==='dKeep'){ clearInterval(dispTimer); dispLock = false; closeSheet(); exec(`D=${DIR}; mkdir -p "$D"; : > "$D/disp_keep"`); toast('Kept'); return; }
    if(b.id==='dRev'){ clearInterval(dispTimer); dispLock = false; closeSheet(); exec(`D=${DIR}; sh "$D/disp_revert.sh"; : > "$D/disp_keep"`).then(async()=>{ await new Promise(r=>setTimeout(r,600)); await loadDisp(); render(); }); return; }
    if(b.id==='close'){ closeSheet(); if(view==='game') render(); return; }
    if(b.dataset.gsw){ const key = b.dataset.gsw, nv = (S[key] ?? b.dataset.def)==='1' ? '0' : '1'; setKey(key,nv); b.classList.toggle('on'); if(b.dataset.regame) gameSheet(gpkg); return; }
    if(b.dataset.tt){ const nv = b.classList.contains('on') ? '0' : '1'; b.classList.toggle('on'); run(()=>ctl('touch',b.dataset.tt,nv)); return; }
    if(b.id==='gRemove'){ const p = gpkg; Object.keys(S).forEach(k => { if(k.startsWith(`game.${p}.`)) delete S[k]; }); closeSheet(); render(); run(()=>ctl('game-remove',p)); return; }
    if(b.dataset.k){ setKey(b.dataset.k,b.dataset.v); patch(b.dataset.k); return; }
    if(b.id==='doRes'){ closeSheet(); pend = new Map(); run(async()=>{ const r = await ctl('restore'); if(/ok/.test(r.out)){ await load(); render(); toast('Settings restored'); } else toast('Restore failed'); }); return; }
    if(b.id==='doRm'){ closeSheet(); run(async()=>{ await ctl('reset',S.active); await load(); render(); }); toast('Mode reset'); return; }
    if(b.id==='doRa'){ closeSheet(); run(async()=>{ await ctl('resetall'); await load(); render(); }); toast('All reset'); return; }
  }
  const p = e.target.closest('[data-tpick]');
  if(p){ const n = p.dataset.tpick;
    setKey(`${S.active}.thermal`, n); thermalSheet(); render(); toast('Thermal: '+(n==='default'?'ROM default':THN[n])); }
});
render();
(async () => {
  const ok = await load(); failed = !ok; await binfo(); render();
  document.addEventListener('visibilitychange', async () => { if(!document.hidden && !pend.size){ await chain; if(await load()) render(); } });
})();
</script>
</body>
