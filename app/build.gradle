plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zane.foxtuner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zane.foxtuner'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
