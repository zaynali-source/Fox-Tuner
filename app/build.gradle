plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zane.foxtuner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zane.foxtuner'
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName '3.5'
    }

    signingConfigs {
        fixed {   // same key on every build so updates install over the old app
            storeFile file('foxtuner.jks')
            storePassword 'foxtuner'
            keyAlias 'foxtuner'
            keyPassword 'foxtuner'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
