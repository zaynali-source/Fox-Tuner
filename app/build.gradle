plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zane.profilestuner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zane.profilestuner'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.1-stable'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // The app UI is the module's WebUI: one single source of truth.
    sourceSets {
        main {
            assets.srcDirs = ['../module/webroot']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
